# 課題管理ボード API の設定
# 言葉の意味は「用語定義書」に従う。手順の正は「Spring Bootバックエンド初期セットアップ」。

# =============================================================================
# 1. アプリ
# =============================================================================

# 用語: アプリ名
# 意味: この API サーバの名前。ログに出る。画面には出ない。
spring.application.name=task-board

# 用語: APIポート
# 意味: 画面や curl がつなぐ待ち受け番号。
server.port=8080

# =============================================================================
# 2. PostgreSQL 接続
# =============================================================================
# 括弧の中（例: localhost）は、環境変数が無いときの初期値である。
# パスワードは手元専用であり、提出用の秘密情報ではない。
# ホスト: localhost / ポート: 5432 / データベース名: task_board

# 用語: 接続URL
# 意味: PostgreSQL の住所。ホスト・ポート・データベース名をつなげたもの。
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_board}

# 用語: ユーザ
# 意味: PostgreSQL に入るときの名前。
spring.datasource.username=${DB_USER:task_board}

# 用語: パスワード
# 意味: PostgreSQL に入るときの合言葉。
spring.datasource.password=${DB_PASSWORD:task_board}

# 用語: JDBCドライバ
# 意味: PostgreSQL へ SQL を出すためのドライバ。pom.xml の postgresql と対になる。
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# 3. 接続プール
# =============================================================================
# バックエンドが PostgreSQL へ同時につなぐ本数と、待ち時間の決め事である。

# 用語: プール名
# 意味: 接続の束の名前。ログに出る。
spring.datasource.hikari.pool-name=task-board-db

# 用語: 最大接続数
# 意味: 同時に開ける PostgreSQL 接続の上限。今回は一人用なので少なくてよい。
spring.datasource.hikari.maximum-pool-size=5

# 用語: 最小接続数
# 意味: 使っていなくても残しておく接続の数。
spring.datasource.hikari.minimum-idle=1

# 用語: 接続待ち時間
# 意味: 接続が空くのを待つ上限（ミリ秒）。Docker の起動が遅いとき用。
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# 4. 表の用意
# =============================================================================

# 用語: SQL初期化
# 意味: 起動のたびに schema.sql（表）と data.sql（初期ボード）を実行する。
spring.sql.init.mode=always

# 用語: 表定義ファイル
# 意味: boards / lists / cards を作る SQL の場所。
spring.sql.init.schema-locations=classpath:schema.sql

# 用語: 初期データファイル
# 意味: 最初のボード・リスト・カードを入れる SQL の場所。
spring.sql.init.data-locations=classpath:data.sql

# 用語: SQLの文字コード
# 意味: schema.sql と data.sql の読み方。日本語を壊さないために UTF-8 とする。
spring.sql.init.encoding=UTF-8

# =============================================================================
# 5. Docker
# =============================================================================

# 用語: Composeファイル
# 意味: PostgreSQL コンテナの定義。backend から見てひとつ上のフォルダにある。
spring.docker.compose.file=../docker-compose.yml

# 用語: コンテナの止め方
# 意味: start-only は、API を止めても PostgreSQL を残す。止めるときは docker compose stop。
spring.docker.compose.lifecycle-management=start-only

# 用語: テスト時のDocker
# 意味: テストではコンテナを起動しない。接続確認は GET /api/health で行う。
spring.docker.compose.skip.in-tests=true
