name: task-board

services:
  postgres:
    image: postgres:16-alpine
    container_name: task-board-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_board}
      POSTGRES_USER: ${POSTGRES_USER:-task_board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_board}
    ports:
      - "5432:5432"
    volumes:
      - task_board_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  task_board_pgdata:
